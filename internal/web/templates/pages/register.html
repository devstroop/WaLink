{{define "content"}}
<div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
  <form method="POST" action="/register" hx-boost="false">
    <h2 class="text-xl font-semibold text-gray-900 mb-6">Create an account</h2>
    <div class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username" required autofocus
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
               placeholder="Choose a username">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
               placeholder="you@example.com">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required minlength="8"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
               placeholder="Min 8 characters">
      </div>
    </div>
    <button type="submit"
            class="w-full mt-6 px-4 py-2.5 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors">
      Create account
    </button>
    <p class="mt-4 text-center text-sm text-gray-500">Already have an account? <a href="/login" class="text-brand-600 hover:text-brand-700 font-medium">Sign in</a></p>
  </form>
</div>
{{end}}
