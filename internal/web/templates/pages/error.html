{{define "content"}}
<div class="bg-white rounded-2xl border border-gray-200 p-10 text-center shadow-sm">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 text-red-500 mb-5">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
  </div>
  <p class="text-sm font-medium text-gray-500 mb-1">Error {{.Data.Code}}</p>
  <h2 class="text-xl font-semibold text-gray-900 mb-2">{{.Data.Title}}</h2>
  <p class="text-sm text-gray-500 mb-8 max-w-sm mx-auto">{{.Data.Message}}</p>
  <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-brand-600 border border-brand-200 rounded-lg hover:bg-brand-50 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
    Back to home
  </a>
</div>
{{end}}
