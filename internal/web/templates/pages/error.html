{{define "content"}}
<div class="bg-white rounded-xl border border-gray-200 p-8 text-center shadow-sm">
  <div class="text-5xl mb-4">{{.Data.Code}}</div>
  <h2 class="text-xl font-semibold text-gray-900 mb-2">{{.Data.Title}}</h2>
  <p class="text-sm text-gray-500 mb-6">{{.Data.Message}}</p>
  <a href="/" class="inline-flex px-4 py-2 text-sm font-medium text-brand-600 border border-brand-200 rounded-lg hover:bg-brand-50 transition-colors">Go home</a>
</div>
{{end}}
