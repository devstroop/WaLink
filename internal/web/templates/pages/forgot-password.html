{{define "content"}}
<div class="bg-white rounded-2xl border border-gray-200 p-6 sm:p-8 shadow-sm">
  <form method="POST" action="/forgot-password" hx-boost="false">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-50 text-brand-600 mb-4">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
    </div>
    <h2 class="text-xl font-bold text-gray-900 mb-1">Forgot your password?</h2>
    <p class="text-sm text-gray-500 mb-6">Enter your email address and we'll send you a reset link.</p>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
      <input type="email" id="email" name="email" required autofocus
             class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-colors"
             placeholder="you@example.com">
    </div>

    <button type="submit"
            class="btn-loading w-full mt-6 px-4 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-xl hover:bg-brand-700 focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-2">
      <svg class="btn-spinner hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
      Send reset link
    </button>

    <div class="mt-5 text-center text-sm">
      <a href="/login" class="text-brand-600 hover:text-brand-700 font-medium inline-flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
        Back to sign in
      </a>
    </div>
  </form>
</div>
{{end}}
