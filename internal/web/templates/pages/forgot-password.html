{{define "content"}}
<div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
  <form method="POST" action="/forgot-password" hx-boost="false">
    <h2 class="text-xl font-semibold text-gray-900 mb-2">Forgot your password?</h2>
    <p class="text-sm text-gray-500 mb-6">Enter your email address and we'll send you a reset link.</p>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" id="email" name="email" required autofocus
             class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-colors"
             placeholder="you@example.com">
    </div>

    <button type="submit"
            class="w-full mt-6 px-4 py-2.5 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition-colors">
      Send reset link
    </button>

    <div class="mt-4 text-center text-sm">
      <a href="/login" class="text-brand-600 hover:text-brand-700 font-medium">Back to sign in</a>
    </div>
  </form>
</div>
{{end}}
