{{define "component/empty-state"}}
{{/* Usage: {{template "component/empty-state" (dict "title" "No accounts" "description" "Create one to get started." "action" "/accounts" "actionLabel" "Create Account")}} */}}
<div class="text-center py-12">
  <svg class="w-12 h-12 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11"/></svg>
  <h3 class="text-sm font-medium text-gray-900">{{.title}}</h3>
  <p class="text-sm text-gray-500 mt-1">{{.description}}</p>
  {{if .action}}
  <a href="{{.action}}" class="inline-flex items-center mt-4 px-4 py-2 text-sm font-medium text-white bg-brand-600 rounded-lg hover:bg-brand-700 transition-colors">
    {{.actionLabel}}
  </a>
  {{end}}
</div>
{{end}}
