{{define "component/badge"}}
{{/* Usage: {{template "component/badge" (dict "text" "Connected" "color" "green")}} */}}
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
      {{if eq .color "green"}}bg-green-100 text-green-800{{end}}
      {{if eq .color "red"}}bg-red-100 text-red-800{{end}}
      {{if eq .color "yellow"}}bg-yellow-100 text-yellow-800{{end}}
      {{if eq .color "gray"}}bg-gray-100 text-gray-800{{end}}
      {{if eq .color "blue"}}bg-blue-100 text-blue-800{{end}}">
  {{.text}}
</span>
{{end}}
