{{define "layout"}}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-gray-50 text-gray-900 font-sans antialiased"
      x-data="{
        sidebarOpen: localStorage.getItem('sidebarOpen') !== 'false',
        mobileMenu: false,
        grpAccounts: localStorage.getItem('grpAccounts') !== 'false',
        grpTools:    localStorage.getItem('grpTools')    !== 'false',
        grpBilling:  localStorage.getItem('grpBilling')  !== 'false',
        grpAdmin:    localStorage.getItem('grpAdmin')    !== 'false',
        init() {
          const p = window.location.pathname;
          if (p === '/accounts' || p.startsWith('/accounts/') || p === '/whatsapp') this.grpAccounts = true;
          if (p.startsWith('/admin/billing'))                  this.grpBilling  = true;
          if (p === '/admin/users' || p === '/admin/roles')    this.grpAdmin    = true;
          if (p === '/api-keys' || p === '/mcp-server')        this.grpTools    = true;
        }
      }"
      x-effect="
        localStorage.setItem('sidebarOpen',  sidebarOpen);
        localStorage.setItem('grpAccounts',  grpAccounts);
        localStorage.setItem('grpTools',     grpTools);
        localStorage.setItem('grpBilling',   grpBilling);
        localStorage.setItem('grpAdmin',     grpAdmin);
      "
      hx-boost="true">
  <!-- Mobile sidebar backdrop -->
  <div x-show="mobileMenu" x-cloak
       @click="mobileMenu = false"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm lg:hidden"></div>
  <div class="flex h-full">
    {{template "partial/sidebar" .}}
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      {{template "partial/navbar" .}}
      <main class="flex-1 overflow-y-auto p-4 sm:p-6">
        {{template "partial/toast" .}}
        {{template "content" .}}
      </main>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
