{{define "partial/toast"}}
{{if .Flash}}
<div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 -translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 -translate-y-2"
     class="mb-4 px-4 py-3 rounded-xl text-sm flex items-center gap-3 shadow-sm
            {{if eq .Flash.Type "success"}}bg-brand-50 text-brand-800 border border-brand-200{{end}}
            {{if eq .Flash.Type "error"}}bg-red-50 text-red-800 border border-red-200{{end}}
            {{if eq .Flash.Type "info"}}bg-blue-50 text-blue-800 border border-blue-200{{end}}">
  {{if eq .Flash.Type "success"}}
  <svg class="w-5 h-5 shrink-0 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
  {{else if eq .Flash.Type "error"}}
  <svg class="w-5 h-5 shrink-0 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
  {{else}}
  <svg class="w-5 h-5 shrink-0 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg>
  {{end}}
  <span class="flex-1">{{.Flash.Message}}</span>
  <button @click="show = false" class="shrink-0 p-0.5 rounded-md opacity-60 hover:opacity-100 transition-opacity">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>
{{end}}
{{end}}
