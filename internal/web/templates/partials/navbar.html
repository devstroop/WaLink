{{define "partial/navbar"}}
<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
  <div class="flex items-center gap-4">
    <button @click="sidebarOpen = !sidebarOpen"
            class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
    </button>
    <h2 class="text-lg font-semibold text-gray-800">{{.Heading}}</h2>
  </div>
  {{if .Identity}}
  <div class="flex items-center gap-3" x-data="{ open: false }">
    <div class="relative">
      <button @click="open = !open"
              class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm text-gray-700 hover:bg-gray-100 transition-colors">
        <div class="w-7 h-7 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-xs font-semibold">
          {{upper (initial .Identity.Username)}}
        </div>
        <span class="hidden sm:inline">{{.Identity.Username}}</span>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div x-show="open" @click.away="open = false" x-transition
           class="absolute right-0 mt-1 w-48 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-50">
        <div class="px-4 py-2 border-b border-gray-100">
          <p class="text-sm font-medium text-gray-900">{{.Identity.Username}}</p>
          <p class="text-xs text-gray-500">{{.Identity.RoleName}}</p>
        </div>
        <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Settings</a>
        <form method="POST" action="/logout" hx-boost="false">
          <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Sign out</button>
        </form>
      </div>
    </div>
  </div>
  {{end}}
</header>
{{end}}
