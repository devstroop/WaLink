name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run --timeout 5m

      - name: Test
        run: go test -v -race -count=1 -timeout 120s ./...

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.VERSION }}"

          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/walink-linux-amd64           ./cmd/walink
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/walink-linux-arm64           ./cmd/walink
          GOOS=linux   GOARCH=386   go build -ldflags "$LDFLAGS" -o dist/walink-linux-386             ./cmd/walink
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/walink-darwin-amd64          ./cmd/walink
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/walink-darwin-arm64          ./cmd/walink
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/walink-windows-amd64.exe     ./cmd/walink
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/walink-windows-arm64.exe     ./cmd/walink
          GOOS=windows GOARCH=386   go build -ldflags "$LDFLAGS" -o dist/walink-windows-386.exe       ./cmd/walink

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/walink-*
            dist/checksums.txt
